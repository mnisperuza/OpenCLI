name: Bug report
description: Report reproducible Fenrir Agent behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include API keys, `.env` files, session databases, or private workspace data."
  - type: input
    id: version
    attributes:
      label: Fenrir Agent version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: "llama.cpp / model.gguf"
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Run ...\n2. Choose ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
