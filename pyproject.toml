[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrir-agent"
dynamic = ["version"]
description = "Fenrir Agent - modern AI CLI capabilities, unified in one trusted agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Matias Nisperuza", email = "mnisperuza1102@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "agent", "assistant", "fenrir", "llm", "local", "cli", "developer-tools"]

# Core dependencies
dependencies = [
    "ddgs>=9.14,<10",
    "pydantic-ai-slim>=1.107,<2",
    "torch>=2.4.0",
    "transformers>=5.2.0",
    "accelerate>=0.34.0",
    "huggingface-hub>=0.24.0",
    "hf_xet>=1.5.1",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "einops>=0.8.0",
    "numpy>=1.26.0,<3.0.0",
    "bitsandbytes>=0.45.0; platform_system != 'Darwin'",
    "hqq>=0.2.8.post1",
    "rich>=14.0.0",
    "pillow>=11.0.0,<13",
    "prompt_toolkit>=3.0.43",
    "questionary>=1.10.0",
    "textual>=7.0.0",
    "tiktoken>=0.7.0,<1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
linux = ["bitsandbytes>=0.43.0; platform_system == 'Linux'"]
macos = []
perf = ["xformers>=0.0.25"]
sandbox = ["e2b>=2.13,<3"]
full = ["bitsandbytes>=0.43.0; platform_system != 'Darwin'", "xformers>=0.0.25; platform_system != 'Darwin'", "e2b>=2.13,<3"]
enterprise = [
    "tenacity>=9,<10",
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
    "pydantic-evals>=1.107,<2",
    "cryptography>=44,<48",
]
constrained = ["outlines>=1.2,<2"]

[project.scripts]
fenrir = "fenrir_agent.cli:main"

[project.urls]
Homepage = "https://github.com/mnisperuza/OpenCLI"
Documentation = "https://github.com/mnisperuza/OpenCLI#readme"
Repository = "https://github.com/mnisperuza/OpenCLI"
Issues = "https://github.com/mnisperuza/OpenCLI/issues"
Changelog = "https://github.com/mnisperuza/OpenCLI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["fenrir_agent*"]

[tool.setuptools.package-data]
fenrir_agent = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "fenrir_agent._version.__version__"}
