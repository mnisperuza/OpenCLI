[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-cli"
version = "1.0.0b"
description = "Bert — A calm, local AI assistant by Biwa Industries"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Biwa", email = "biwaindustries@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "assistant", "llm", "local", "cli", "qwen", "bert"]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "huggingface-hub>=0.20.0",
    "hf_xet>=1.1.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
linux = [
    "bitsandbytes>=0.43.0",
]
web = [
    "duckduckgo-search>=6.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
bert = "bert.cli:main"

[project.urls]
Homepage = "https://github.com/mnisperuza/bert-cli"
Documentation = "https://github.com/mnisperuza/bert-cli#readme"
Repository = "https://github.com/mnisperuza/bert-cli"
Issues = "https://github.com/mnisperuza/bert-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bert*"]
