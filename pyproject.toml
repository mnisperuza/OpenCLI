[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencli"
dynamic = ["version"]
description = "OpenCLI — local AI assistant"
readme = "README.md"
license = {text = "Apache 2.0"}
authors = [
    {name = "Matias Nisperuza", email = "mnisperuza1102@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "assistant", "llm", "local", "cli", "qwen"]

# Core dependencies
dependencies = [
    "ddgs>=9.14,<10",
    "pydantic-ai-slim>=1.107,<2",
    "torch>=2.4.0",              # Actualizado para mejor soporte de bfloat16 y kernels de atención en 2026
    "transformers>=5.2.0",       # REQUISITO CRÍTICO: Necesario para la arquitectura híbrida de Qwen 3.5
    "accelerate>=0.34.0",        # Actualizado para la distribución automática de capas GQA
    "huggingface-hub>=0.24.0",   # Actualizado para manejar los nuevos formatos de checkpoints
    "hf_xet>=1.5.1",             # Sincronizado con lo que instaló tu sistema
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "einops>=0.8.0",             # Recomendado para las operaciones de tensores en la atención lineal de Qwen 3.5
    "numpy>=1.26.0,<3.0.0",      # Ampliado el rango para evitar conflictos con librerías modernas
    "bitsandbytes>=0.45.0",
    "hqq>=0.2.8.post1",          # INT8 HQQ backend for Q8 KV-cache quantization
    "rich>=14.0.0",
    "pillow>=11.0.0,<13",
    "prompt_toolkit>=3.0.43",
    "questionary>=1.10.0",
    "textual>=7.0.0",
    "tiktoken>=0.7.0,<1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
linux = ["bitsandbytes>=0.43.0"]
perf = ["xformers>=0.0.25"]
sandbox = ["e2b>=2.13,<3"]
full = ["bitsandbytes>=0.43.0", "xformers>=0.0.25", "e2b>=2.13,<3"]
enterprise = [
    "tenacity>=9,<10",
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
    "pydantic-evals>=1.107,<2",
    "cryptography>=44,<48",
]
constrained = ["outlines>=1.2,<2"]

[project.scripts]
opencli = "main.cli:main"

[project.urls]
Homepage = "https://github.com/mnisperuza/OpenCLI"
Documentation = "https://github.com/mnisperuza/OpenCLI#readme"
Repository = "https://github.com/mnisperuza/OpenCLI"
Issues = "https://github.com/mnisperuza/OpenCLI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["main*"]

[tool.setuptools.dynamic]
version = {attr = "main._version.__version__"}
